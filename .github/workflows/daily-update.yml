name: Daily Policy Data Update

on:
  schedule:
    # 每日三轮抓取（注释为北京时间；GitHub cron 用 UTC，常有 10~60 分钟延后）
    # 第一轮 北京 05:30：把昨天一整天的政策全部收进来，上班前打开就是新的
    - cron: '30 21 * * *'
    # 第二轮 北京 13:00：补进当天上午发布的新政策
    - cron: '0 5 * * *'
    # 第三轮 北京 17:30：收尾当天下午发布的内容
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    # 评论抓取要遍历党媒数字报（人民日报 + 经济日报）的多日版面，
    # 首次初始化回溯较多，给足超时余量
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python scripts/update_data.py

      - name: Check changes
        id: diff
        # 用 git status 而不是 git diff：评论累积库首次生成时是 untracked 文件，
        # git diff 看不到，会导致「有新数据却不提交」
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update policy data + commentary"
          git push
