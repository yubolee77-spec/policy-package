name: Daily Policy Data Update

on:
  schedule:
    # 每日三轮抓取（注释为北京时间；GitHub cron 用 UTC，常有 10~60 分钟延后）
    # 第一轮 北京 05:30：把昨天一整天的政策全部收进来，上班前打开就是新的
    - cron: '30 21 * * *'
    # 第二轮 北京 13:00：补进当天上午发布的新政策
    - cron: '0 5 * * *'
    # 第三轮 北京 17:30：收尾当天下午发布的内容
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    # 评论抓取要遍历党媒数字报（人民日报 + 经济日报）的多日版面，
    # 历年对比要按 30+ 产业主题翻页检索。实测单轮约 24 分钟（2026-09-17 run #30），
    # 原来 30 分钟的余量太紧 —— 一旦被超时杀掉，这一轮抓取同样白跑，故放宽到 45。
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python scripts/update_data.py

      - name: Check changes
        id: diff
        # 用 git status 而不是 git diff：评论累积库首次生成时是 untracked 文件，
        # git diff 看不到，会导致「有新数据却不提交」
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update policy data + commentary"
          # 远端 main 可能在本轮运行期间被别的提交推进（仓库主人推代码、本地 backfill、手工 api-push）。
          # 裸 git push 会被拒（rejected / fetch first），本轮抓到的数据整批作废，
          # 站点就停在上一轮时间 —— 2026-09-17 run #29 就是这么白跑了 24 分钟。
          # 所以先 rebase 再推，并留几次重试窗口。
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push 成功（第 $i 次尝试）"
              exit 0
            fi
            # rebase 若因数据文件与远端同改而冲突，则退化为 merge：
            # -X ours 让「本次抓取的数据」优先于远端旧数据，避免整轮成果丢失。
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次 push 失败，改用 merge 合并远端后重试"
            git fetch origin main
            git merge -X ours --no-edit origin/main || {
              echo "::error::合并远端 main 失败，需人工介入"
              exit 1
            }
            sleep 5
          done
          echo "::error::连续 4 次 push 失败，请检查是否有并发提交长期占用 main"
          exit 1
