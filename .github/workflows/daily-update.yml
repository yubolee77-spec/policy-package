name: Daily Policy Data Update

on:
  schedule:
    # ── 针对 GitHub cron 漂移的三项加固（2026-09-18）──
    # 1) 分钟全部避开 :00 与 :30 —— 这两个分钟是 GitHub 内部 cron 分派集群的尖峰，
    #    本站原配置 30 21 / 0 5 / 30 9 三条全部踩在尖峰上，实测一天只落地约 1 轮。
    # 2) 每轮铺 2 个槽位（抖动后的分钟 + 1.5 小时后的冗余槽），任一落地即当轮生效。
    # 3) 冗余槽靠下面的 guard 步骤做幂等短路，已落地的轮次秒退，不会重复抓取。
    #
    # 早班：北京 05:17 / 06:43 —— 收进前一天全天政策，上班前打开就是新的
    - cron: '17 21 * * *'
    - cron: '43 22 * * *'
    # 午班：北京 12:37 / 14:07 —— 补当天上午发布的新政策
    - cron: '37 4 * * *'
    - cron: '7 6 * * *'
    # 晚班：北京 17:23 / 18:53 —— 收尾当天下午发布的内容
    - cron: '23 9 * * *'
    - cron: '53 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    # 评论抓取要遍历党媒数字报（人民日报 + 经济日报）的多日版面，
    # 历年对比要按 30+ 产业主题翻页检索。实测单轮约 24 分钟（2026-09-17 run #30），
    # 原来 30 分钟的余量太紧 —— 一旦被超时杀掉，这一轮抓取同样白跑，故放宽到 45。
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 幂等短路：本轮窗口已经有数据就秒退 ──
      # 冗余槽位必须配这一步，否则 6 条 cron 全落地会重复抓 6 次。
      # 判据是 data/latest.json 的 fetchedAt（北京时间，格式 YYYY-MM-DD HH:MM）：
      # 早班看「今天是否已有数据」，午班看「>= 今天 11:00」，晚班看「>= 今天 15:00」。
      # 于是三轮各最多真抓一次，总抓取量与本轮改动前一致。
      - name: Skip if this round already landed
        id: guard
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime, json, os

          WINDOW_START = {
              '17 21 * * *': '00:00',
              '43 22 * * *': '00:00',
              '37 4 * * *':  '11:00',
              '7 6 * * *':   '11:00',
              '23 9 * * *':  '15:00',
              '53 10 * * *': '15:00',
          }
          sched = (os.environ.get('SCHED') or '').strip()
          out = os.environ['GITHUB_OUTPUT']
          start = WINDOW_START.get(sched)

          if not start:
              print(f'非排程触发（schedule={sched!r}），直接执行抓取')
              skip = 'false'
          else:
              try:
                  with open('data/latest.json', encoding='utf-8') as f:
                      current = json.load(f).get('fetchedAt', '')
              except Exception as exc:
                  print(f'读 data/latest.json 失败（{exc}），按未落地处理')
                  current = ''
              bj_now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
              target = f"{bj_now:%Y-%m-%d} {start}"
              if current and current >= target:
                  print(f'本轮窗口（>= {target}）已有数据 {current}，跳过')
                  skip = 'true'
              else:
                  print(f'本轮窗口（>= {target}）尚无数据（当前 {current}），执行抓取')
                  skip = 'false'

          with open(out, 'a', encoding='utf-8') as f:
              f.write(f'skip={skip}\n')
          PY

      - name: Run update script
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/update_data.py

      - name: Check changes
        id: diff
        if: steps.guard.outputs.skip != 'true'
        # 用 git status 而不是 git diff：评论累积库首次生成时是 untracked 文件，
        # git diff 看不到，会导致「有新数据却不提交」
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update policy data + commentary"
          # 远端 main 可能在本轮运行期间被别的提交推进（仓库主人推代码、本地 backfill、手工 api-push）。
          # 裸 git push 会被拒（rejected / fetch first），本轮抓到的数据整批作废，
          # 站点就停在上一轮时间 —— 2026-09-17 run #29 就是这么白跑了 24 分钟。
          # 所以先 rebase 再推，并留几次重试窗口。
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push 成功（第 $i 次尝试）"
              exit 0
            fi
            # rebase 若因数据文件与远端同改而冲突，则退化为 merge：
            # -X ours 让「本次抓取的数据」优先于远端旧数据，避免整轮成果丢失。
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次 push 失败，改用 merge 合并远端后重试"
            git fetch origin main
            git merge -X ours --no-edit origin/main || {
              echo "::error::合并远端 main 失败，需人工介入"
              exit 1
            }
            sleep 5
          done
          echo "::error::连续 4 次 push 失败，请检查是否有并发提交长期占用 main"
          exit 1
