name: Daily Policy Data Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run update
        run: python scripts/update_data.py

      - name: Check changes
        id: diff
        run: |
          git diff --stat | grep -q . && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Commit push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Auto-update policy data"
          git push origin main
